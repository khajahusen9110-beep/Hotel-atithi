<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Installed app (PWA) look on iPhone / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hotel Atithi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Atithi Raichur - Order Food Online | Biryani, Tandoori &amp; Chinese Delivery</title>
    <meta name="description" content="Order food online from Hotel Atithi, Raichur. Hot Chicken &amp; Mutton Biryani, Tandoori, Chinese and Veg meals delivered to your door. No delivery charge, Cash on Delivery." />
    <meta name="keywords" content="Hotel Atithi, Hotel Atithi Raichur, food delivery Raichur, order food online Raichur, biryani Raichur, best restaurant in Raichur, Raichur restaurant, tandoori Raichur, Chinese food Raichur, home delivery Raichur" />
    <meta name="author" content="Hotel Atithi" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f97316" />
    <link rel="canonical" href="https://hotel-atithi.com/" />

    <!-- Open Graph / Facebook / WhatsApp (these crawlers don't run JavaScript) -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Hotel Atithi" />
    <meta property="og:url" content="https://hotel-atithi.com/" />
    <meta property="og:title" content="Hotel Atithi Raichur - Order Food Online" />
    <meta property="og:description" content="Hot Biryani, Tandoori, Chinese and Veg meals from Hotel Atithi, Raichur. No delivery charge, Cash on Delivery." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=1200&auto=format&fit=crop&q=80" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotel Atithi Raichur - Order Food Online" />
    <meta name="twitter:description" content="Hot Biryani, Tandoori, Chinese and Veg meals from Hotel Atithi, Raichur. No delivery charge, Cash on Delivery." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=1200&auto=format&fit=crop&q=80" />

    <!-- Local SEO geo tags (kept in sync with the admin settings at runtime) -->
    <meta name="geo.region" content="IN-KA" />
    <meta name="geo.placename" content="Raichur, Karnataka" />
    <meta name="geo.position" content="16.2111455;77.3572712" />
    <meta name="ICBM" content="16.2111455, 77.3572712" />

    <!-- Restaurant structured data for Google. Address, phone, location and opening
         hours are replaced at runtime with the values from the admin Settings page. -->
    <script type="application/ld+json" id="restaurant-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "@id": "https://hotel-atithi.com/#restaurant",
      "name": "Hotel Atithi",
      "url": "https://hotel-atithi.com/",
      "image": "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=1200&auto=format&fit=crop&q=80",
      "description": "Multi-cuisine restaurant in Raichur serving Biryani, Tandoori, Chinese, Veg and Non-Veg dishes with home delivery.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Raichur",
        "addressLocality": "Raichur",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 16.2111455,
        "longitude": 77.3572712
      },
      "areaServed": { "@type": "City", "name": "Raichur" },
      "servesCuisine": ["Indian", "Biryani", "Tandoori", "Chinese", "North Indian", "South Indian"],
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, UPI",
      "hasMenu": "https://hotel-atithi.com/",
      "potentialAction": {
        "@type": "OrderAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://hotel-atithi.com/",
          "inLanguage": "en",
          "actionPlatform": [
            "http://schema.org/DesktopWebPlatform",
            "http://schema.org/MobileWebPlatform"
          ]
        },
        "deliveryMethod": "http://purl.org/goodrelations/v1#DeliveryModeOwnFleet"
      }
    }
    </script>
    <!-- Start the TLS handshake with the API while the JS downloads -->
    <link rel="preconnect" href="https://jlfrnjhnprvixlckvvmc.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- One variable font file covers every weight the UI uses (400-900) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
