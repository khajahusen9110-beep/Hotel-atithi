services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env
      - /run/base44/app.env
    command: sh -c "ls node_modules/.bin/vite || npm install --ignore-scripts; npx vite --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  node_modules:
